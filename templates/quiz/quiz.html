{% extends 'common/base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto p-6 bg-white shadow rounded-lg mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center">Complete your test</h2>

    <form method="post" class="space-y-8">
        {% csrf_token %}

        {% for question in questions %}
            <div class="border-b pb-4">
                <p class="text-lg font-semibold text-gray-800 mb-2">{{ question.text }}</p>

                {% for answer in question.answers.all %}
                    <label class="flex items-center space-x-2 mb-2">
                        <input
                            type="radio"
                            name="question_{{ question.id }}"
                            value="{{ answer.id }}"
                            class="form-radio text-indigo-600"
                        >
                        <span class="text-gray-700">{{ answer.text }}</span>
                    </label>
                {% endfor %}
            </div>
        {% endfor %}

        <div class="text-center">
            <button
                type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded transition"
            >
                Submit Your Answers
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% block nav %}
{% endblock %}
