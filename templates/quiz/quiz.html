{% extends 'common/base.html' %}

{% block content %}
<div class="content">
    <h1 class="title">Complete Your Test</h1>

    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <div class="question-block">
                <p class="question-text">{{ field.label }}</p>

                <div class="answer-options">
                    {% for answer in field %}
                        <label class="answer-option">
                            {{ answer.tag }}
                            <span>{{ answer.choice_label }}</span>
                        </label>
                    {% endfor %}
                </div>

                {% if field.errors %}
                    <div class="error-message">
                        {{ field.errors|striptags }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <div class="submit-answers">
            <button type="submit" class="btn-2">
                Submit Your Answers
            </button>
        </div>
    </form>
</div>
{% endblock %}
